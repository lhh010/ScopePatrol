# ScopePatrol 训练配置。改这里,不要改脚本。
# ---------------------------------------------------------------------------

# 数据集分组(与 cleansight-yolo/<组>/data.yaml 一致;各组 class id 从 0 开始)。
groups:
  group1_large: [hand, scope_control_body, scope_mid_section]
  group2_small: [syringe, scope_distal_end, short_brush]

# 训练超参
train:
  model: yolo11s.pt    # nano 更快;小目标为主的组建议后续换更大 imgsz
  epochs: 100
  imgsz: 640
  batch: 16
  patience: 20         # 连续多少 epoch 无提升则早停

# 验收标准(04_validate 判 PASS/FAIL 用,数据/模型迭代后收紧)。
acceptance:
  overall_map50: 0.5       # 整体 mAP@0.5 下限
  overall_map50_95: 0.3    # 整体 mAP@0.5:0.95 下限
  per_class_recall: 0.7    # 逐类 recall 下限(漏检代价高)
  per_class_precision: 0.5 # 逐类 precision 下限
